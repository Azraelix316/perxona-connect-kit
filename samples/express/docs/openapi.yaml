# SPDX-License-Identifier: MIT
openapi: 3.1.0
info:
  title: Perxona Connect API
  description: The Perxona Connect API — authentication, avatar catalog, and TTS token routes for the sv-presenter Web Component.
  version: 0.1.0
servers: []
paths:
  /api/v1/connect/auth/login:
    post:
      tags:
        - connect
        - connect
      summary: Authenticate a Connect user and issue an access token
      description: >-
        Authenticate with email/password and receive a JWT access token signed with the dedicated Connect secret. Pass
        the token as `Authorization: Bearer <token>` on subsequent Connect API calls.


        ## Rate Limit 

        This endpoint is limit __5 calls / 1 seconds__
      operationId: post_v1_connect_connect_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectLoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/auth/logout:
    post:
      tags:
        - connect
        - connect
      summary: Revoke the Connect access token
      description: >-
        Adds the current Connect Bearer token to the revocation set. Subsequent requests using the same token will be
        rejected with 401.
      operationId: post_v1_connect_connect_logout
      responses:
        '204':
          description: Successful Response
      security:
        - HTTPBearer: []
  /api/v1/connect/assets/avatars:
    get:
      tags:
        - connect
        - connect
      summary: List avatars
      description: Return a paginated list of active avatars accessible to the authenticated user's organization.
      operationId: get_v1_connect_list_avatars
      security:
        - HTTPBearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 50
            title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ConnectListAvatarResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/assets/avatars/{avatar_id}:
    get:
      tags:
        - connect
        - connect
      summary: Get avatar detail
      description: Return full detail for a single active avatar including LOD URLs and lipsync support.
      operationId: get_v1_connect_get_avatar
      security:
        - HTTPBearer: []
      parameters:
        - name: avatar_id
          in: path
          required: true
          schema:
            type: string
            title: Avatar Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectAvatarDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/assets/avatars/{avatar_id}/motions:
    get:
      tags:
        - connect
        - connect
      summary: List avatar motions
      description: >-
        Return a paginated list of active motions compatible with the avatar's skeleton, optionally filtered by pose
        tag.
      operationId: get_v1_connect_list_connect_avatar_motions
      security:
        - HTTPBearer: []
      parameters:
        - name: avatar_id
          in: path
          required: true
          schema:
            type: string
            title: Avatar Id
        - name: pose_tag
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: ^pose:[a-z0-9_]+$
              - type: 'null'
            title: Pose Tag
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 50
            title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ConnectMotionAssetResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/assets/scenes:
    get:
      tags:
        - connect
        - connect
      summary: List scenes
      description: Return a paginated list of active scenes accessible to the authenticated user's organization.
      operationId: get_v1_connect_list_scenes
      security:
        - HTTPBearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 50
            title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ConnectListSceneResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/assets/scenes/{scene_id}:
    get:
      tags:
        - connect
        - connect
      summary: Get scene detail
      description: Return full detail for a single active scene including LOD URLs.
      operationId: get_v1_connect_get_scene
      security:
        - HTTPBearer: []
      parameters:
        - name: scene_id
          in: path
          required: true
          schema:
            type: string
            title: Scene Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectSceneDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/assets/vrm/upload:
    post:
      tags:
        - connect
        - connect
      summary: Upload a VRM file and register it as an avatar
      description: >-
        Accepts a VRM file, converts it to a Cocos-compatible bundle, uploads the bundle to S3, and registers the result
        as a new active avatar asset in the caller's organization. This call blocks until conversion and upload
        complete.


        ## Rate Limit 

        This endpoint is limit __5 calls / 60 seconds__
      operationId: post_v1_connect_upload_vrm
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_vrm_api_v1_connect_assets_vrm_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectVRMUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
  /api/v1/connect/voices:
    get:
      tags:
        - connect
        - connect
      summary: List available custom voice models
      description: >-
        Return a paginated list of custom voices available to the organization. Supports filtering by language and
        provider.


        ## Rate Limit 

        This endpoint is limit __30 calls / 1 seconds__
      operationId: get_v1_connect_connect_list_voices
      security:
        - HTTPBearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 50
            title: Size
        - name: search_term
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Search Term
        - name: date_range_type
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/DateRangeStrEnum'
              - type: 'null'
            title: Date Range Type
        - name: start_at
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
              - type: 'null'
            title: Start At
        - name: end_at
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
              - type: 'null'
            title: End At
        - name: language
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/Language'
              - type: 'null'
            title: Language
        - name: provider
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/VoiceProvider'
              - type: 'null'
            title: Provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ConnectVoiceResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/voice-tokens/tts:
    post:
      tags:
        - connect
        - connect
      summary: Generate a text-to-speech token
      description: |-
        Issue a TTS token for the given custom voice ID.

        ## Rate Limit 
        This endpoint is limit __5 calls / 1 seconds__
      operationId: post_v1_connect_connect_generate_text_to_speech_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectVoiceTextToSpeechTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectVoiceTextToSpeechTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
  /api/v1/connect/presentation:
    post:
      tags:
        - connect
        - connect
      summary: Generate presentation payload
      description: >-
        Generate a one-shot presentation payload for SDK consumers. The endpoint accepts an avatar asset, a custom
        voice, and text to speak, then returns clean display text, formatted speech content, and a performance manifest
        of motion assets.


        ## Rate Limit 

        This endpoint is limit __10 calls / 1 seconds__
      operationId: post_v1_connect_create_presentation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectPresentationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectPresentationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
  /api/v1/connect/chatbots:
    get:
      tags:
        - connect
        - connect
      summary: List chat bots
      description: List all non-deleted chat bots (including disabled ones) for the caller's organization as lightweight summaries.
      operationId: get_v1_connect_list_chat_bots
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ChatBotSummaryResponse'
                type: array
                title: Response List Chat Bots Api V1 Connect Chatbots Get
      security:
        - HTTPBearer: []
    post:
      tags:
        - connect
        - connect
      summary: Create a chat bot
      description: >-
        Create a new Connect chat bot, optionally seeding its knowledge file and tools. Knowledge file upload and tool
        creation are best-effort: their failure does not roll back the created chat bot.


        ## Rate Limit 

        This endpoint is limit __5 calls / 60 seconds__
      operationId: post_v1_connect_create_chat_bot
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_chat_bot_api_v1_connect_chatbots_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatBotDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
  /api/v1/connect/chatbots/{chat_bot_id}:
    get:
      tags:
        - connect
        - connect
      summary: Get chat bot detail
      description: Get full detail for a single chat bot, including its knowledge status and tools.
      operationId: get_v1_connect_get_chat_bot
      security:
        - HTTPBearer: []
      parameters:
        - name: chat_bot_id
          in: path
          required: true
          schema:
            type: string
            title: Chat Bot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatBotDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
        - connect
        - connect
      summary: Update a chat bot
      description: >-
        Partially update a chat bot's fields, knowledge file, and/or tools. Only fields actually provided are changed.
        knowledge_file and remove_knowledge are mutually exclusive. Omit tools to leave the tool set unchanged; pass an
        empty array to clear it. Knowledge operations commit independently, so they remain applied if a subsequent tool
        or field update fails.


        ## Rate Limit 

        This endpoint is limit __5 calls / 60 seconds__
      operationId: patch_v1_connect_update_chat_bot
      security:
        - HTTPBearer: []
      parameters:
        - name: chat_bot_id
          in: path
          required: true
          schema:
            type: string
            title: Chat Bot Id
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_update_chat_bot_api_v1_connect_chatbots__chat_bot_id__patch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatBotDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
        - connect
        - connect
      summary: Delete a chat bot
      description: Soft-delete a chat bot and clean up its knowledge/tool bindings.
      operationId: delete_v1_connect_delete_chat_bot
      security:
        - HTTPBearer: []
      parameters:
        - name: chat_bot_id
          in: path
          required: true
          schema:
            type: string
            title: Chat Bot Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/chatbots/{chat_bot_id}/chat:
    post:
      tags:
        - connect
        - connect
      summary: Send a message to a chat bot
      operationId: post_v1_connect_chat_with_chat_bot
      security:
        - HTTPBearer: []
      parameters:
        - name: chat_bot_id
          in: path
          required: true
          schema:
            type: string
            title: Chat Bot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectChatBotChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectChatBotChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AssetLOD:
      type: string
      enum:
        - lod0
        - lod1
        - lod2
      title: AssetLOD
      description: The level of detail for the asset
    AssetLodCdnUrl:
      $defs:
        AssetType:
          description: The type of the asset
          enum:
            - avatar
            - scene
            - motion
            - facial_motion
          title: AssetType
          type: string
      description: The CDN URLs for each LOD level
      properties:
        type:
          anyOf:
            - $ref: '#/components/schemas/AssetType'
            - type: 'null'
          default: null
        lod0:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Lod0
        lod1:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Lod1
        lod2:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Lod2
      title: AssetLodCdnUrl
      type: object
    AssetType:
      type: string
      enum:
        - avatar
        - scene
        - motion
        - facial_motion
      title: AssetType
      description: The type of the asset
    AvatarThumbnailType:
      type: string
      enum:
        - default
        - head
        - upper_body
        - full_body
        - three_quarter_face
        - animated_full_body
        - hd
        - loading
      title: AvatarThumbnailType
      description: The type of thumbnail for the asset
    Body_create_chat_bot_api_v1_connect_chatbots_post:
      properties:
        name:
          type: string
          title: Name
        custom_instructions:
          anyOf:
            - type: string
            - type: 'null'
          title: Custom Instructions
        knowledge_file:
          anyOf:
            - type: string
              format: binary
            - type: 'null'
          title: Knowledge File
        tools:
          anyOf:
            - type: string
            - type: 'null'
          title: Tools
      type: object
      required:
        - name
      title: Body_create_chat_bot_api_v1_connect_chatbots_post
    Body_update_chat_bot_api_v1_connect_chatbots__chat_bot_id__patch:
      properties:
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Name
        custom_instructions:
          anyOf:
            - type: string
            - type: 'null'
          title: Custom Instructions
        chat_bot_status:
          anyOf:
            - $ref: '#/components/schemas/ConnectChatBotStatus'
            - type: 'null'
        knowledge_file:
          anyOf:
            - type: string
              format: binary
            - type: 'null'
          title: Knowledge File
        remove_knowledge:
          type: boolean
          title: Remove Knowledge
          default: false
        tools:
          anyOf:
            - type: string
            - type: 'null'
          title: Tools
      type: object
      title: Body_update_chat_bot_api_v1_connect_chatbots__chat_bot_id__patch
    Body_upload_vrm_api_v1_connect_assets_vrm_upload_post:
      properties:
        vrm_file:
          type: string
          format: binary
          title: Vrm File
        avatar_name:
          anyOf:
            - type: string
              maxLength: 256
            - type: 'null'
          title: Avatar Name
          description: Display name for the new avatar. Defaults to the VRM filename if omitted.
      type: object
      required:
        - vrm_file
      title: Body_upload_vrm_api_v1_connect_assets_vrm_upload_post
    ChatBotDetailResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        custom_instructions:
          anyOf:
            - type: string
            - type: 'null'
          title: Custom Instructions
        status:
          $ref: '#/components/schemas/ConnectChatBotStatus'
        knowledge:
          anyOf:
            - $ref: '#/components/schemas/ConnectChatBotKnowledgeFileDO'
            - type: 'null'
        tools:
          items:
            $ref: '#/components/schemas/ConnectChatBotToolDO'
          type: array
          title: Tools
      type: object
      required:
        - id
        - name
        - status
      title: ChatBotDetailResponse
      description: Full chat bot detail, including its bound knowledge file and tools.
    ChatBotSummaryResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        status:
          $ref: '#/components/schemas/ConnectChatBotStatus'
      type: object
      required:
        - id
        - name
        - status
      title: ChatBotSummaryResponse
      description: Lightweight chat bot summary, used for the list endpoint.
    ConnectAvatarDetailResponse:
      properties:
        avatar_id:
          type: string
          title: Avatar Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        thumbnail_urls:
          additionalProperties:
            type: string
          propertyNames:
            $ref: '#/components/schemas/AvatarThumbnailType'
          type: object
          title: Thumbnail Urls
        tags:
          items:
            type: string
          type: array
          title: Tags
        lod_urls:
          additionalProperties:
            type: string
          propertyNames:
            $ref: '#/components/schemas/AssetLOD'
          type: object
          title: Lod Urls
        lipsync_configs:
          additionalProperties:
            additionalProperties:
              $ref: '#/components/schemas/LipSyncConfig-Output'
            type: object
          propertyNames:
            $ref: '#/components/schemas/LipSyncMode'
          type: object
          title: Lipsync Configs
      type: object
      required:
        - avatar_id
        - name
        - description
        - thumbnail_urls
        - tags
        - lod_urls
        - lipsync_configs
      title: ConnectAvatarDetailResponse
    ConnectChatBotChatRequest:
      properties:
        messages:
          $ref: '#/components/schemas/ConnectChatBotMessages'
      type: object
      required:
        - messages
      title: ConnectChatBotChatRequest
      description: Validated HTTP body for a stateless Connect chat request.
    ConnectChatBotChatResponse:
      properties:
        id:
          type: string
          title: Id
        status:
          $ref: '#/components/schemas/ConnectChatBotInteractionStatus'
        reply_text:
          anyOf:
            - type: string
            - type: 'null'
          title: Reply Text
      type: object
      required:
        - id
        - status
      title: ConnectChatBotChatResponse
    ConnectChatBotInteractionStatus:
      type: string
      enum:
        - pending
        - succeeded
        - failed
      title: ConnectChatBotInteractionStatus
    ConnectChatBotKnowledgeFileDO:
      properties:
        chat_bot_id:
          type: string
          title: Chat Bot Id
        file_id:
          type: string
          title: File Id
        status:
          $ref: '#/components/schemas/ConnectKnowledgeFileStatus'
      type: object
      required:
        - chat_bot_id
        - file_id
        - status
      title: ConnectChatBotKnowledgeFileDO
      description: Domain object describing a chat bot's bound knowledge file.
    ConnectChatBotMessage:
      properties:
        role:
          $ref: '#/components/schemas/ConnectChatBotMessageRole'
        parts:
          items:
            $ref: '#/components/schemas/ConnectChatBotMessagePart'
          type: array
          minItems: 1
          title: Parts
      type: object
      required:
        - role
        - parts
      title: ConnectChatBotMessage
    ConnectChatBotMessagePart:
      properties:
        type:
          $ref: '#/components/schemas/ConnectChatBotMessagePartType'
          default: text
        text:
          type: string
          maxLength: 8000
          title: Text
      type: object
      required:
        - text
      title: ConnectChatBotMessagePart
    ConnectChatBotMessagePartType:
      type: string
      enum:
        - text
      title: ConnectChatBotMessagePartType
    ConnectChatBotMessageRole:
      type: string
      enum:
        - user
        - assistant
      title: ConnectChatBotMessageRole
    ConnectChatBotMessages:
      items:
        $ref: '#/components/schemas/ConnectChatBotMessage'
      type: array
      minItems: 1
      title: ConnectChatBotMessages
    ConnectChatBotStatus:
      type: string
      enum:
        - active
        - disabled
      title: ConnectChatBotStatus
    ConnectChatBotToolAPIKeyAuthDO:
      properties:
        secret_type:
          type: string
          const: api_key
          title: Secret Type
          default: api_key
        api_key_header:
          anyOf:
            - type: string
            - type: 'null'
          title: Api Key Header
        api_key_value:
          anyOf:
            - type: string
            - type: 'null'
          title: Api Key Value
      type: object
      title: ConnectChatBotToolAPIKeyAuthDO
      description: Masked API key authentication configuration returned for a tool.
    ConnectChatBotToolBearerTokenAuthDO:
      properties:
        secret_type:
          type: string
          const: bearer_token
          title: Secret Type
          default: bearer_token
        bearer_token:
          anyOf:
            - type: string
            - type: 'null'
          title: Bearer Token

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NavGuide Screen Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }
    #highlight-box {
      position: absolute;
      display: none;
      border: 3px solid #38bdf8;
      border-radius: 14px;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.8), inset 0 0 14px rgba(56, 189, 248, 0.35);
      animation: pulse-ring 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      transition: all 0.2s ease-out;
      pointer-events: auto;
      cursor: pointer;
      z-index: 999999;
    }
    #highlight-box.active {
      display: block;
    }
    /* Outer pulsing ripple wave */
    #highlight-box::after {
      content: "";
      position: absolute;
      inset: -8px;
      border: 2px solid rgba(56, 189, 248, 0.6);
      border-radius: 18px;
      animation: ripple-wave 1.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      pointer-events: none;
    }
    #highlight-tag {
      position: absolute;
      top: -36px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0b1020;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 8px;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4), 0 0 12px rgba(56, 189, 248, 0.6);
      display: flex;
      align-items: center;
      gap: 6px;
      animation: float-tag 2s ease-in-out infinite;
      pointer-events: auto;
    }
    #highlight-tag::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0 6px;
      border-style: solid;
      border-color: #818cf8 transparent transparent transparent;
    }
    @keyframes pulse-ring {
      0%, 100% {
        transform: scale(1);
        border-color: #38bdf8;
        box-shadow: 0 0 22px rgba(56, 189, 248, 0.8), inset 0 0 12px rgba(56, 189, 248, 0.3);
      }
      50% {
        transform: scale(1.02);
        border-color: #818cf8;
        box-shadow: 0 0 38px rgba(129, 140, 248, 1), inset 0 0 20px rgba(129, 140, 248, 0.5);
      }
    }
    @keyframes ripple-wave {
      0% {
        transform: scale(0.98);
        opacity: 0.85;
      }
      100% {
        transform: scale(1.16);
        opacity: 0;
      }
    }
    @keyframes float-tag {
      0%, 100% {
        transform: translate(-50%, 0);
      }
      50% {
        transform: translate(-50%, -4px);
      }
    }
  </style>
</head>
<body>
  <div id="highlight-box">
    <div id="highlight-tag">👉 Click Here</div>
  </div>
  <script>
    const highlightBox = document.getElementById("highlight-box");
    const highlightTag = document.getElementById("highlight-tag");

    // Click on the highlight box dismisses it
    highlightBox.addEventListener("click", (e) => {
      e.stopPropagation();
      console.log('[Overlay.html] User clicked highlight box -> dismissing.');
      highlightBox.classList.remove("active");
      window.electronAPI?.hideHighlight?.();
    });

    window.electronAPI?.onHighlight?.((data) => {
      console.log('[Overlay.html] onHighlight received:', JSON.stringify(data));
      if (!data || !data.rect) {
        highlightBox.classList.remove("active");
        return;
      }
      const { x, y, width, height, label } = data.rect;
      highlightBox.style.left = (x || 0) + "px";
      highlightBox.style.top = (y || 0) + "px";
      highlightBox.style.width = Math.max(width || 80, 50) + "px";
      highlightBox.style.height = Math.max(height || 40, 30) + "px";
      if (label) {
        highlightTag.textContent = "👉 " + label;
      } else {
        highlightTag.textContent = "👉 Click Here";
      }
      highlightBox.classList.add("active");
    });

    window.electronAPI?.onHideHighlight?.(() => {
      console.log('[Overlay.html] onHideHighlight received');
      highlightBox.classList.remove("active");
    });
  </script>
</body>
</html>

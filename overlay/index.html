<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NavGuide — AI Desktop Companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="mode-collapsed">
  <div class="app-container">

    <!-- 1. Collapsed Mode: Floating Circle Orb & Proactive Speech Bubble -->
    <div id="collapsed-view" class="collapsed-view">
      <!-- Floating Prediction Bubble -->
      <div id="proactive-bubble" class="proactive-bubble" title="Click to chat with NavGuide">
        <div class="proactive-header">
          <span class="proactive-badge">✨ NavGuide</span>
          <span class="proactive-hint">Click to open</span>
        </div>
        <div id="proactive-text" class="proactive-text">Hi! I'm watching your screen. Click me or this bubble anytime for instant guidance!</div>
      </div>

      <!-- Floating Circle Avatar Orb -->
      <button id="avatar-orb" class="avatar-orb" title="Click to open full avatar">
        <div class="orb-pulse"></div>
        <div class="orb-inner">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 3a3 3 0 1 1-3 3 3 3 0 0 1 3-3zm0 14.2a7.2 7.2 0 0 1-6-3.22c.03-1.99 4-3.08 6-3.08s5.97 1.09 6 3.08a7.2 7.2 0 0 1-6 3.22z"/>
          </svg>
        </div>
        <div class="orb-status-dot"></div>
      </button>
    </div>

    <!-- 2. Expanded Mode: Full 3D Avatar Card Stage -->
    <div id="expanded-view" class="expanded-view">
      <!-- Header with Collapse & Close Controls -->
      <div class="card-header">
        <div class="card-title drag-handle">✨ NavGuide</div>
        <div class="card-controls">
          <button id="collapse-btn" class="header-btn" title="Collapse to circle orb">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <button id="close-btn" class="header-btn" title="Close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>

      <!-- Dynamic Speech Bubble Popover -->
      <div id="speech-bubble" class="speech-bubble">
        <div id="bubble-role" class="bubble-role">NavGuide</div>
        <div id="bubble-text" class="bubble-text">Hi! I'm watching your screen. Click me anytime for instant guidance!</div>
        <div id="quick-actions" class="quick-actions" hidden></div>
      </div>

      <!-- Avatar Stage -->
      <div id="avatar-stage" class="avatar-stage" title="Click avatar for instant screen prediction!">
        <sv-presenter id="presenter"></sv-presenter>
        <div id="loading" class="stage-loading">Connecting avatar...</div>
        <div id="error" class="stage-error" hidden></div>
      </div>

      <!-- Floating Action Controls -->
      <div class="control-bar">
        <button id="mic-btn" class="mic-btn" title="Click or hold to speak">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <button id="text-toggle-btn" class="text-toggle-btn" title="Type a message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
      </div>

      <!-- Expandable Text Input Drawer -->
      <div id="text-drawer" class="text-drawer">
        <input type="text" id="text-input" class="text-input" placeholder="Ask anything about your screen..." autocomplete="off"/>
        <button id="send-btn" class="send-btn">Send</button>
      </div>

      <!-- Status Toast -->
      <div id="toast" class="toast"></div>
    </div>

  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
